app = "licitai-db"
primary_region = "gru"

[build]
  image = "postgres:16"

[env]
  PGDATA = "/var/lib/postgresql/data/pgdata"

[[mounts]]
  source = "pg_data"
  destination = "/var/lib/postgresql/data"

[[services]]
  internal_port = 5432
  protocol = "tcp"

  [[services.tcp_checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
