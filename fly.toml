app = "licitai"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.prod"

[deploy]
  release_command = "node /app/lib/db/scripts/migrate.mjs"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  TRUST_PROXY = "1"

[processes]
  api = "env APP_ROLE=api STATIC_DIR=/app/artifacts/licitainsight/dist/public node --enable-source-maps /app/artifacts/api-server/dist/index.mjs"
  worker = "env APP_ROLE=worker WORKER_HEALTH_PORT=3002 node --enable-source-maps /app/artifacts/api-server/dist/index.mjs"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["api"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/readyz"
    timeout = "5s"

[[services]]
  internal_port = 3002
  protocol = "tcp"
  processes = ["worker"]

  [[services.http_checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/healthz"
    timeout = "5s"

[[vm]]
  processes = ["api"]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[vm]]
  processes = ["worker"]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
