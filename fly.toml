app = "licitai"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.prod"

[deploy]
  release_command = "node /app/lib/db/scripts/migrate.mjs"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  TRUST_PROXY = "1"

[processes]
  app = "env APP_ROLE=all STATIC_DIR=/app/artifacts/licitainsight/dist/public node --enable-source-maps /app/artifacts/api-server/dist/index.mjs"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/readyz"
    timeout = "5s"

[[vm]]
  processes = ["app"]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

# Gatilho de escala (~20 assinantes): troque `app` pelos processos `api` e
# `worker` documentados em docs/ops/deploy-fly.md. Nunca exponha METRICS_PORT.
