        dismissedAt: { type: string, format: date-time }
    RestoreNotificationsResult:
      type: object
      properties:
        restoredCount: { type: integer, minimum: 0 }
        unreadCount: { type: integer, minimum: 0 }
      required: [restoredCount, unreadCount]
    OpportunityStatus:
      type: string
      enum: [open, upcoming, closed, undated]
    OpportunityProgram:
      type: string
      enum: [audiovisual, lpg, fac, fsa]
    OpportunityKind:
      type: string
      enum: [culture, funding, innovation, partnership, procurement]
    OpportunitySource:
      type: string
      enum:
        [
          mapas,
          finep,
          cnpq,
          capes,
          transferegov,
          funarte,
          minc,
          salic,
          worldbank,
          eu_ft,
          idb,
          fap,
        ]
    OpportunityScope:
      type: string
      description: Reach of the call, not its nature. An international call still has a `kind`.
      enum: [national, international]
    OpportunityScopeFilter:
      type: string
      enum: [national, international, all]
      default: national
    InternationalRegion:
      type: string
      enum: [america-latina, africa, europa, asia, oriente-medio, global]
    BrazilEligibility:
      type: string
      enum: ["yes", conditional, "no", unknown]
    OpportunityEligibilityAnswer:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/BrazilEligibility"
        label: { type: string }
        reason:
          type: [string, "null"]
          description: Readable sentence of the rule that decided. Indicative; the official notice prevails.
        rule:
          type: [string, "null"]
          description: Slug of the rule. Present on `brazilEligibility` only.
      required: [status, label, reason]
    InternationalOpportunityDetail:
      type: object
      properties:
        label: { type: string }
        value: { type: string }
      required: [label, value]
    InternationalOpportunityDeadline:
      type: object
      properties:
        at:
          type: [string, "null"]
          format: date-time
          description: Same instant as `registrationTo`.
        precision:
          type: [string, "null"]
          enum: [datetime, date, null]
          description: With `date` only the day is known; an hour in `original` was not converted.
        timeZone:
          type: [string, "null"]
          description: IANA zone of the wall clock the source published.
        original:
          type: [string, "null"]
          description: The deadline as the source wrote it, in its own wall clock.
      required: [at, precision, timeZone, original]
    InternationalOpportunity:
      type: object
      properties:
        agency: { type: [string, "null"] }
        country:
          type: [string, "null"]
          description: ISO 3166-1 alpha-2 of the country where the call is executed.
        countryName: { type: [string, "null"] }
        region:
          anyOf:
            - $ref: "#/components/schemas/InternationalRegion"
            - type: "null"
        regionName: { type: [string, "null"] }
        brazilProject: { type: boolean }
        language: { type: [string, "null"] }
        languageName: { type: [string, "null"] }
        titleOriginal: { type: [string, "null"] }
        titlePt: { type: [string, "null"] }
        translationSource:
          type: [string, "null"]
          enum: [source, model, null]
        amountOriginal: { type: [number, "null"], minimum: 0 }
        currency:
          type: [string, "null"]
          description: ISO 4217 code of `amountOriginal`.
        amountBrlApprox:
          type: [number, "null"]
          minimum: 0
          description: "`amountOriginal` at the PTAX selling rate of `fxDate`. An approximation."
        fxRate: { type: [number, "null"] }
        fxDate: { type: [string, "null"], format: date }
        deadline:
          $ref: "#/components/schemas/InternationalOpportunityDeadline"
        brazilEligibility:
          anyOf:
            - $ref: "#/components/schemas/OpportunityEligibilityAnswer"
            - type: "null"
        brazilFunding:
          anyOf:
            - $ref: "#/components/schemas/OpportunityEligibilityAnswer"
            - type: "null"
        eligibilityCheckedAt: { type: [string, "null"], format: date-time }
        details:
          type: array
          items:
            $ref: "#/components/schemas/InternationalOpportunityDetail"
      required:
        [
          agency,
          country,
          countryName,
          region,
          regionName,
          brazilProject,
          language,
          languageName,
          titleOriginal,
          titlePt,
          translationSource,
          amountOriginal,
          currency,
          amountBrlApprox,
          fxRate,
          fxDate,
          deadline,
          brazilEligibility,
          brazilFunding,
          eligibilityCheckedAt,
          details,
        ]
    OpportunityNoticeOrigin:
      type: string
      enum: [source_page, document]
      description: "`source_page`: the call page at the source (or the page is the platform itself). `document`: one of its official documents."
    OpportunityApplication:
      type: object
      properties:
        url: { type: string, format: uri }
        platform:
          type: [string, "null"]
          description: Slug of a known platform (`sucupira`, `carlos-chagas`, `salic`, `mapas-culturais`…). `null` for a link accepted only by the words around it.
        label:
          type: [string, "null"]
          description: Platform name to show ("Plataforma Sucupira").
        article:
          type: [string, "null"]
          enum: [a, o, null]
          description: Definite article of `label` in Portuguese, to write "na Plataforma Sucupira" or "no Salic".
        origin:
          $ref: "#/components/schemas/OpportunityNoticeOrigin"
        documentTitle:
          type: [string, "null"]
          description: Title of the document that indicates the link, when `origin` is `document`.
      required: [url, platform, label, article, origin, documentTitle]
    OpportunityNoticeDates:
      type: object
      properties:
        registrationFrom: { type: [string, "null"], format: date-time }
        registrationTo: { type: [string, "null"], format: date-time }
        origin:
          $ref: "#/components/schemas/OpportunityNoticeOrigin"
        documentTitle: { type: [string, "null"] }
      required: [registrationFrom, registrationTo, origin, documentTitle]
    OpportunityDocument:
      type: object
      properties:
        title: { type: string }
        url: { type: string, format: uri }
        mediaType: { type: [string, "null"] }
      required: [title, url, mediaType]
    OpportunityProfileMatch:
      type: object
      properties:
        score: { type: number, minimum: 0, maximum: 100 }
        reasons:
          type: array
          items: { type: string }
      required: [score, reasons]
    OpportunityInstallation:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        uf: { type: string }
      required: [id, name, uf]
    OpportunitySummary:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: [string, "null"] }
        organizationName: { type: string }
        status:
          $ref: "#/components/schemas/OpportunityStatus"
        program:
          anyOf:
            - $ref: "#/components/schemas/OpportunityProgram"
            - type: "null"
        kind:
          $ref: "#/components/schemas/OpportunityKind"
        source:
          $ref: "#/components/schemas/OpportunitySource"
        sourceName: { type: string }
        audience: { type: [string, "null"] }
        amount: { type: [number, "null"], minimum: 0 }
        documents:
          type: array
          items:
            $ref: "#/components/schemas/OpportunityDocument"
        registrationFrom: { type: [string, "null"], format: date-time }
        registrationTo: { type: [string, "null"], format: date-time }
        state: { type: [string, "null"] }
        installation:
          $ref: "#/components/schemas/OpportunityInstallation"
        sourceUrl: { type: [string, "null"], format: uri }
        updatedAt: { type: string, format: date-time }
        profileMatch:
          anyOf:
            - $ref: "#/components/schemas/OpportunityProfileMatch"
            - type: "null"
        scope:
          $ref: "#/components/schemas/OpportunityScope"
        international:
          description: Set on international calls only.
          anyOf:
            - $ref: "#/components/schemas/InternationalOpportunity"
            - type: "null"
        application:
          description: Where to apply, read without AI from the call page or its documents. `null` when none was found with confidence.
          anyOf:
            - $ref: "#/components/schemas/OpportunityApplication"
            - type: "null"
        applicationCheckedAt:
          type: [string, "null"]
          format: date-time
          description: Last reading of the call page and documents. `null` while the call was never read.
        noticeDates:
          description: Registration period read from the notice. Set only when the source publishes no dates of its own.
          anyOf:
            - $ref: "#/components/schemas/OpportunityNoticeDates"
            - type: "null"
      required:
        [
          id,
          title,
          summary,
          organizationName,
          status,
          program,
          kind,
          source,
          sourceName,
          audience,
          amount,
          documents,
          registrationFrom,
          registrationTo,
          state,
          installation,
          sourceUrl,
          updatedAt,
          profileMatch,
          scope,
          international,
        ]
