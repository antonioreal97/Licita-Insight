  /v1/opportunities:
    get:
      operationId: searchOpportunities
      tags: [opportunities]
      summary: Search culture, funding and innovation opportunities
      description: Serves only the first 1000 results (page × pageSize ≤ 1000); deeper pages return 400 with issue `beyond_result_window`, and `pagination.totalPages` is capped to the last reachable page while `total` stays the real count.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: state
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, pattern: "^[A-Za-z]{2}$" }
        - name: installation
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/OpportunityStatus"
        - name: program
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/OpportunityProgram"
        - name: kind
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/OpportunityKind"
        - name: source
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/OpportunitySource"
        - name: scope
          in: query
          description: Reach of the calls. Without it only national calls are returned.
          schema:
            $ref: "#/components/schemas/OpportunityScopeFilter"
        - name: agency
          in: query
          description: Funding body of an international call, exactly as returned in the facet.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, minLength: 1, maxLength: 200 }
        - name: region
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/InternationalRegion"
        - name: country
          in: query
          description: ISO 3166-1 alpha-2 code of the country where the call is executed.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, pattern: "^[A-Za-z]{2}$" }
        - name: language
          in: query
          description: BCP 47 language code of the notice at the source.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, pattern: "^[A-Za-z]{2}$" }
        - name: opportunityType
          in: query
          description: Type of the call at the source, exactly as returned in the facet.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, minLength: 1, maxLength: 200 }
        - name: eligibility
          in: query
          description: Whether an entity or person from Brazil can take part.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/BrazilEligibility"
        - name: funding
          in: query
          description: Whether the funder pays a participant from Brazil.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/BrazilEligibility"
        - name: deadlineFrom
          in: query
          description: Inclusive lower date in America/Sao_Paulo.
          schema: { type: string, format: date }
        - name: deadlineTo
          in: query
          description: Inclusive upper date in America/Sao_Paulo.
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Facets"
      responses:
        "200":
          description: Opportunity result page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunitySearchResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "503":
          $ref: "#/components/responses/SearchUnavailable"
