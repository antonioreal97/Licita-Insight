        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailUnsubscribeRequest"
      responses:
        "200":
          description: Updated email preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailUnsubscribeResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
  /v1/me/notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [account]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Unread notification count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadNotificationCount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/me/notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [account]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkNotificationsReadRequest"
      responses:
        "200":
          description: Remaining unread notification count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadNotificationCount"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/me/notifications/dismiss:
    post:
      operationId: dismissNotifications
      tags: [account]
      security: [{ sessionCookie: [] }]
      description: >-
        Removes notifications from the feed, the unread count and e-mail (soft delete: producers never create them
        again). `ids` of other users are ignored. Every row removed by one call shares `dismissedAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DismissNotificationsRequest"
      responses:
        "200":
          description: Removed notifications and the remaining unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DismissNotificationsResult"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/me/notifications/restore:
    post:
      operationId: restoreNotifications
      tags: [account]
      security: [{ sessionCookie: [] }]
      description: >-
        Undoes a removal: `ids`, or the `dismissedAt` returned by the dismiss call. `ids` of other users are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreNotificationsRequest"
      responses:
        "200":
          description: Restored notifications and the remaining unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreNotificationsResult"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: licita_session
  parameters:
    Query:
      name: q
      in: query
      schema:
        type: string
    SearchMode:
      name: mode
      in: query
      schema:
        $ref: "#/components/schemas/SearchMode"
        default: keyword
    StatusFilter:
      name: status
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: "#/components/schemas/TenderStatus"
    ModalityFilter:
      name: modality
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: "#/components/schemas/Modality"
    StateFilter:
      name: state
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: "^[A-Za-z]{2}$"
    CityFilter:
      name: city
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          minLength: 1
    OrganizationFilter:
      name: organizationId
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          minLength: 1
    SourceFilter:
      name: sourceId
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          minLength: 1
    CategoryFilter:
      name: category
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          minLength: 1
    PlatformFilter:
      name: platform
      in: query
      description: Normalized bidding platform slug (`TenderPlatform.slug`).
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          minLength: 1
    NewOnly:
      name: newOnly
      in: query
      description: Only tenders first inserted in Pardal within `NEW_TENDER_WINDOW_HOURS` (24 hours by default).
      schema:
        type: boolean
        default: false
    NotificationFilter:
      name: notification
      in: query
      description: >-
        Restricts results to the tender ids captured by this notification. Requires a session;
        notifications not owned by the signed-in user are returned as an empty snapshot.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    MyRegion:
      name: myRegion
      in: query
      description: Apply the signed-in company's saved service region.
      schema:
        type: boolean
        default: false
    ValueMin:
      name: valueMin
      in: query
      schema:
        type: number
        minimum: 0
    ValueMax:
      name: valueMax
      in: query
      schema:
        type: number
        minimum: 0
    PublishedFrom:
      name: publishedFrom
      in: query
      description: Inclusive lower publication date in America/Sao_Paulo.
      schema:
        type: string
        format: date
    PublishedTo:
      name: publishedTo
      in: query
      description: Inclusive upper publication date in America/Sao_Paulo.
      schema:
        type: string
        format: date
    DeadlineFrom:
      name: deadlineFrom
      in: query
      description: Inclusive lower proposal deadline date in America/Sao_Paulo.
      schema:
        type: string
        format: date
    DeadlineTo:
      name: deadlineTo
      in: query
      description: Inclusive upper proposal deadline date in America/Sao_Paulo.
      schema:
        type: string
        format: date
    Sort:
      name: sort
      in: query
      schema:
        $ref: "#/components/schemas/SortOption"
        default: relevance
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Facets:
      name: facets
      in: query
      schema:
        type: boolean
        default: true
  responses:
    InvalidParameter:
      description: Invalid request parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SearchUnavailable:
      description: Search subsystem unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The request is forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource limit or state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BillingUnavailable:
      description: Billing provider is unavailable or rejected the operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SubscriptionRequired:
      description: An active subscription or development entitlement is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AiQuotaExceeded:
      description: "Daily AI quota exhausted: details[0].issue is daily_tenders (processes) or daily_questions (safety cap on new questions)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AiUnavailable:
      description: Tender question service unavailable or not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: [string, "null"]
        avatarUrl:
          type: [string, "null"]
          format: uri
        createdAt:
          type: string
          format: date-time
      required: [id, email, name, avatarUrl, createdAt]
    UsagePurpose:
      type: string
      enum: [procurement, culture, funding, research, study]
    ApplicantType:
      type: string
      enum: [individual, mei, company, nonprofit]
    AccountUsageProfile:
      type: object
      additionalProperties: false
      properties:
        usagePurposes:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/UsagePurpose" }
        applicantTypes:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/ApplicantType" }
        usageInviteDismissed: { type: boolean }
      required: [usagePurposes, applicantTypes, usageInviteDismissed]
    AccountUsageProfilePatch:
      type: object
      additionalProperties: false
      properties:
        usagePurposes:
          type: array
          uniqueItems: true
          maxItems: 5
          items: { $ref: "#/components/schemas/UsagePurpose" }
        applicantTypes:
          type: array
          uniqueItems: true
          maxItems: 4
          items: { $ref: "#/components/schemas/ApplicantType" }
        usageInviteDismissed: { type: boolean }
      minProperties: 1
    AuthSessionResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required: [user]
    DevLoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 120
      required: [email]
    BillingStatus:
      type: string
      enum: [none, pending, active, past_due, canceled]
    BillingEntitlementSource:
      type: [string, "null"]
      enum: [subscription, coupon, trial, beta, dev, null]
    BillingResponse:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/BillingStatus"
        entitled: { type: boolean }
        source:
          $ref: "#/components/schemas/BillingEntitlementSource"
        trialEndsAt: { type: [string, "null"], format: date-time }
        currentPeriodEnd: { type: [string, "null"], format: date-time }
        couponAccessUntil: { type: [string, "null"], format: date-time }
        canCancel: { type: boolean }
        monthlyBrl: { type: [number, "null"] }
      required:
        [
          status,
          entitled,
          source,
          trialEndsAt,
          currentPeriodEnd,
          canCancel,
          monthlyBrl,
          couponAccessUntil,
        ]
    CreateCouponRequest:
      type: object
      additionalProperties: false
      properties:
        code: { type: string, minLength: 4, maxLength: 64, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{3,63}$" }
        durationDays: { type: integer, enum: [7, 30] }
        maxRedemptions: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        startsAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
      required: [durationDays]
    RedeemCouponRequest:
      type: object
      additionalProperties: false
      properties:
        code: { type: string, minLength: 4, maxLength: 64 }
      required: [code]
    CouponResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        durationDays: { type: integer, enum: [7, 30] }
        maxRedemptions: { type: integer }
        redeemedCount: { type: integer }
        startsAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
      required: [id, code, durationDays, maxRedemptions, redeemedCount, startsAt, expiresAt]
    CouponRedemptionResponse:
      type: object
      properties:
        accessUntil: { type: string, format: date-time }
        durationDays: { type: integer, enum: [7, 30] }
        alreadyRedeemed: { type: boolean }
      required: [accessUntil, durationDays, alreadyRedeemed]
    OpenTendersByState:
      type: object
      properties:
        state:
          type: string
          pattern: "^[A-Z]{2}$"
          description: State code (UF)
        openTenders:
          type: integer
          minimum: 0
        estimatedValueTotal:
          type: [number, "null"]
          minimum: 0
          description: >-
            Sum of the estimated values that were published, leaving out the ones flagged as implausible
            (`estimatedValueFlag`); null when no open tender in the state has a value to add
        updatedAt:
          type: [string, "null"]
          format: date-time
          description: Most recent fetch among the open tenders of the state; null when it has none
      required: [state, openTenders, estimatedValueTotal, updatedAt]
    OpenTendersByStateMeta:
      type: object
      properties:
        totalOpenTenders: { type: integer, minimum: 0 }
        generatedAt:
          type: string
          format: date-time
          description: When the aggregate was computed
        indexUpdatedAt:
          type: [string, "null"]
          format: date-time
          description: Most recent fetch among all counted tenders
        cacheTtlSeconds: { type: integer, minimum: 0 }
      required: [totalOpenTenders, generatedAt, indexUpdatedAt, cacheTtlSeconds]
    OpenTendersByStateResponse:
      type: object
      properties:
        data:
          type: array
          minItems: 27
          maxItems: 27
          items:
            $ref: "#/components/schemas/OpenTendersByState"
        meta:
          $ref: "#/components/schemas/OpenTendersByStateMeta"
      required: [data, meta]
    BillingPlanResponse:
      type: object
      properties:
        monthlyBrl: { type: [number, "null"] }
        trialDays: { type: integer, enum: [7] }
        currency: { type: string, enum: [BRL] }
      required: [monthlyBrl, trialDays, currency]
    BillingCheckoutResponse:
      type: object
      properties:
        url: { type: string, format: uri }
      required: [url]
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      properties:
        confirm:
          type: string
          enum: [EXCLUIR]
      required: [confirm]
    EmailDigestPreference:
      type: string
      enum: [daily, off]
    EmailNotificationPreferences:
      type: object
      additionalProperties: false
      properties:
        digest:
          $ref: "#/components/schemas/EmailDigestPreference"
        immediateCritical:
          type: boolean
      required: [digest, immediateCritical]
    NotificationPreferences:
      type: object
      additionalProperties: false
      properties:
        email:
          $ref: "#/components/schemas/EmailNotificationPreferences"
        profileAlerts:
          type: boolean
        emailAddress:
          type: string
          format: email
        updatedAt:
          type: [string, "null"]
          format: date-time
      required: [email, profileAlerts, emailAddress, updatedAt]
    RecommendationPreferences:
      type: object
      additionalProperties: false
      properties:
        personalizationEnabled: { type: boolean }
        showInternationalOpportunities:
          type: boolean
          description: Off by default. International calls enter recommendations and profile matching only when on.
        updatedAt: { type: [string, "null"], format: date-time }
      required:
        [personalizationEnabled, showInternationalOpportunities, updatedAt]
    UpdateRecommendationPreferencesRequest:
      type: object
      additionalProperties: false
      properties:
        personalizationEnabled: { type: boolean }
        deleteHistory:
          type: boolean
          default: true
          description: Applies when disabling; defaults to true so turning opt-in off erases the event history.
        showInternationalOpportunities:
          type: boolean
          description: Kept as it is when omitted.
      required: [personalizationEnabled]
    DismissRecommendationRequest:
      type: object
      properties:
        reason:
          type: string
          enum: [not_offering, region, value, deadline]
          description: Optional explicit feedback; omitted preserves the existing topic penalty.
    RecommendationEventRequest:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            type: { type: string, const: search }
            query: { type: string, maxLength: 2000 }
          required: [type, query]
        - type: object
          additionalProperties: false
          properties:
            type: { type: string, const: tender_view }
            tenderId: { type: string, minLength: 1, maxLength: 200 }
          required: [type, tenderId]
        - type: object
          additionalProperties: false
          properties:
            type: { type: string, const: click }
            tenderId: { type: string, minLength: 1, maxLength: 200 }
          required: [type]
        - type: object
          additionalProperties: false
          properties:
            type: { type: string, const: interest }
            tenderId: { type: string, minLength: 1, maxLength: 200 }
          required: [type, tenderId]
    UpdateEmailNotificationPreferences:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        digest:
          $ref: "#/components/schemas/EmailDigestPreference"
        immediateCritical:
          type: boolean
    UpdateNotificationPreferencesRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        email:
          $ref: "#/components/schemas/UpdateEmailNotificationPreferences"
        profileAlerts:
          type: boolean
    EmailUnsubscribeScope:
      type: string
      enum: [all, digest, immediate]
    EmailUnsubscribeRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 500
        scope:
          $ref: "#/components/schemas/EmailUnsubscribeScope"
      required: [token, scope]
    EmailUnsubscribeResponse:
      type: object
      additionalProperties: false
      properties:
        scope:
          $ref: "#/components/schemas/EmailUnsubscribeScope"
        email:
          $ref: "#/components/schemas/EmailNotificationPreferences"
      required: [scope, email]
    AccountExportUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: [string, "null"] }
        avatarUrl: { type: [string, "null"], format: uri }
        trialEndsAt: { type: string, format: date-time }
        emailDigest:
          $ref: "#/components/schemas/EmailDigestPreference"
        emailImmediateCritical: { type: boolean }
        profileAlerts: { type: boolean }
        usagePurposes:
          type: array
          items: { $ref: "#/components/schemas/UsagePurpose" }
        applicantTypes:
          type: array
          items: { $ref: "#/components/schemas/ApplicantType" }
        usageInviteDismissed: { type: boolean }
        recommendationPersonalizationEnabled: { type: boolean }
        showInternationalOpportunities: { type: boolean }
        recommendationPreferencesUpdatedAt:
          { type: [string, "null"], format: date-time }
        emailPreferencesUpdatedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        [
          id,
          email,
          name,
          avatarUrl,
          trialEndsAt,
          emailDigest,
          emailImmediateCritical,
          profileAlerts,
          usagePurposes,
          applicantTypes,
          usageInviteDismissed,
          recommendationPersonalizationEnabled,
          showInternationalOpportunities,
          recommendationPreferencesUpdatedAt,
          emailPreferencesUpdatedAt,
          createdAt,
          updatedAt,
        ]
    AccountExportSession:
      type: object
      properties:
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
      required: [createdAt, lastSeenAt, expiresAt, revokedAt]
    AccountExportSavedTender:
      type: object
      allOf:
        - $ref: "#/components/schemas/ParticipationData"
      properties:
        tenderId: { type: string }
        savedAt: { type: string, format: date-time }
        monitored: { type: boolean }
        monitoredAt: { type: [string, "null"], format: date-time }
      required: [tenderId, savedAt, monitored, monitoredAt]
    AccountExportSavedSearch:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        query: { type: string }
        alertsEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, "null"], format: date-time }
        lastCheckedAt: { type: [string, "null"], format: date-time }
        newMatchesCount: { type: integer, minimum: 0 }
      required:
        [
          id,
          name,
          query,
          alertsEnabled,
          createdAt,
          updatedAt,
          deletedAt,
          lastCheckedAt,
          newMatchesCount,
        ]
    AccountExportNotification:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
        dismissedAt: { type: [string, "null"], format: date-time }
        tenderId: { type: [string, "null"] }
        tenderTitle: { type: [string, "null"] }
        tenderNumberShort: { type: [string, "null"] }
        tenderOrganizationName: { type: [string, "null"] }
        tenderProposalDeadline: { type: [string, "null"], format: date-time }
        change:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        savedSearchId: { type: [string, "null"] }
        savedSearchName: { type: [string, "null"] }
        savedSearchQuery: { type: [string, "null"] }
        matchCount: { type: [integer, "null"] }
        tenderIds:
          type: array
          items: { type: string }
        profileMatches:
          type: array
          items:
            $ref: "#/components/schemas/ProfileMatchNotification"
      required:
        [
          id,
          type,
          createdAt,
          readAt,
          dismissedAt,
          tenderId,
          tenderTitle,
          tenderNumberShort,
          tenderOrganizationName,
          tenderProposalDeadline,
          change,
          savedSearchId,
          savedSearchName,
          savedSearchQuery,
          matchCount,
          tenderIds,
          profileMatches,
        ]
    AccountExportEmailDelivery:
      type: object
      properties:
        id: { type: string }
        mode: { type: string, enum: [digest, immediate] }
        status: { type: string, enum: [queued, sent, failed, skipped] }
        recipientEmail: { type: string, format: email }
        subject: { type: string }
        htmlBody: { type: string }
        textBody: { type: string }
        attempts: { type: integer, minimum: 0 }
        lastError: { type: [string, "null"] }
        providerMessageId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        sentAt: { type: [string, "null"], format: date-time }
      required:
        [
          id,
          mode,
          status,
          recipientEmail,
          subject,
          htmlBody,
          textBody,
          attempts,
          lastError,
          providerMessageId,
          createdAt,
          updatedAt,
          sentAt,
        ]
    AccountExportSubscription:
      type: object
      properties:
        status: { type: string }
        currentPeriodEnd: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [status, currentPeriodEnd, updatedAt]
    AccountExportAiQuestion:
      type: object
      properties:
        id: { type: string }
        tenderId: { type: string }
        question: { type: string }
        status:
          { type: string, enum: [processing, answered, not_found, failed] }
        passages:
          type: array
          items:
            $ref: "#/components/schemas/AskTenderPassage"
        summary:
          anyOf:
            - type: object
              properties:
                text: { type: string }
                citations: { type: array, items: { type: integer, minimum: 1 } }
                model: { type: string }
              required: [text, citations, model]
            - type: "null"
        requestedModel: { type: string }
