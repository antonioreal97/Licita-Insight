        dismissedCount: { type: integer, minimum: 0 }
        dismissedAt: { type: [string, "null"], format: date-time }
        unreadCount: { type: integer, minimum: 0 }
      required: [dismissedCount, dismissedAt, unreadCount]
    RestoreNotificationsRequest:
      type: object
      additionalProperties: false
      properties:
        ids:
          type: array
          maxItems: 100
