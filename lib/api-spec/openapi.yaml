openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.3.0
  description: Public Licita Insight API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: search
    description: Tender discovery operations
  - name: account
    description: Authentication and personal account operations
  - name: ai
    description: Evidence-only tender document questions
  - name: opportunities
    description: Cultural funding opportunity operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: PostgreSQL readiness check (2 second deadline)
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
        "503":
          description: PostgreSQL is unavailable
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: unavailable }
  /v1/tenders/search:
    get:
      operationId: searchTenders
      tags: [search]
      summary: Search tenders
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/SearchMode"
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/IncludeMonitored"
        - $ref: "#/components/parameters/ModalityFilter"
        - $ref: "#/components/parameters/StateFilter"
        - $ref: "#/components/parameters/CityFilter"
        - $ref: "#/components/parameters/OrganizationFilter"
        - $ref: "#/components/parameters/SourceFilter"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/ValueMin"
        - $ref: "#/components/parameters/ValueMax"
        - $ref: "#/components/parameters/PublishedFrom"
        - $ref: "#/components/parameters/PublishedTo"
        - $ref: "#/components/parameters/DeadlineFrom"
        - $ref: "#/components/parameters/DeadlineTo"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Facets"
      responses:
        "200":
          description: Search result page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SearchUnavailable"
  /v1/tenders/{id}:
    get:
      operationId: getTenderById
      tags: [search]
      summary: Get a tender by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Tender detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/tenders/{id}/ask-status:
    get:
      operationId: getTenderAskStatus
      tags: [ai]
      summary: Get or start the document index used for tender questions
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Current index and daily quota status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderAskStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tenders/{id}/ask:
    post:
      operationId: askTender
      tags: [ai]
      summary: Find official passages that answer a question about a tender
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskTenderRequest"
      responses:
        "200":
          description: Evidence passages, an explicit no-result, or an indexing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskTenderResult"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AiQuotaExceeded"
        "503":
          $ref: "#/components/responses/AiUnavailable"
  /v1/tenders/{id}/sheet:
    get:
      operationId: getTenderSheet
      tags: [ai]
      summary: Get or start the evidence-backed key-field sheet for a tender
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Sheet state mirroring the document index; all 13 fields are present when ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderSheet"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AiQuotaExceeded"
        "503":
          $ref: "#/components/responses/AiUnavailable"
  /v1/me/company-profile:
    get:
      operationId: getCompanyProfile
      tags: [ai]
      summary: Read the signed-in account company profile
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Current profile, or null when none was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      operationId: putCompanyProfile
      tags: [ai]
      summary: Replace the company profile and invalidate previous fit results
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyProfileInput"
      responses:
        "200":
          description: Updated versioned profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfileResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteCompanyProfile
      tags: [ai]
      summary: Delete the company profile and its cached fit results
      security: [{ sessionCookie: [] }]
      responses:
        "204":
          description: Profile deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/me/fit:
    get:
      operationId: getTenderFits
      tags: [ai]
      summary: Read or enqueue company-profile fit for up to 100 tenders
      security: [{ sessionCookie: [] }]
      parameters:
        - name: tenderIds
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Cached, filtered, or pending fit results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderFitsResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
  /v1/search/suggestions:
    get:
      operationId: getSearchSuggestions
      tags: [search]
      summary: Get search autocomplete suggestions
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 8
      responses:
        "200":
          description: Suggestions ordered by relevance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionsResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SearchUnavailable"
  /v1/auth/google/start:
    get:
      operationId: startGoogleAuth
      tags: [account]
      summary: Start Google OAuth with PKCE
      parameters:
        - name: returnTo
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to Google authorization, or to /login?error=oauth_unavailable when credentials are absent
  /v1/auth/google/callback:
    get:
      operationId: completeGoogleAuth
      tags: [account]
      summary: Complete Google OAuth
      responses:
        "302":
          description: Redirect to the application
  /v1/auth/session:
    get:
      operationId: getAuthSession
      tags: [account]
      summary: Get the authenticated user
      responses:
        "200":
          description: Active session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [account]
      summary: Revoke the current session
      responses:
        "204":
          description: Session revoked or already absent
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/auth/dev-login:
    post:
      operationId: devLogin
      tags: [account]
      summary: Create a development-only session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevLoginRequest"
      responses:
        "204":
          description: Development session created
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/me:
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Permanently delete the authenticated account and its personal data
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: Account deleted and session cookie cleared
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/BillingUnavailable"
  /v1/me/export:
    get:
      operationId: exportAccountData
      tags: [account]
      summary: Export the authenticated user's retained personal data
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Personal data export
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename in the form licitai-dados-YYYY-MM-DD.json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/me/billing:
    get:
      operationId: getBilling
      tags: [account]
      summary: Get subscription and entitlement state
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Billing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/billing/plan:
    get:
      operationId: getBillingPlan
      tags: [account]
      summary: Get the public single-plan price and trial duration
      responses:
        "200":
          description: Public plan configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPlanResponse"
  /v1/me/billing/checkout:
    post:
      operationId: startBillingCheckout
      tags: [account]
      summary: Start or resume recurring subscription checkout
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Hosted Asaas checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCheckoutResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/BillingUnavailable"
  /v1/me/billing/cancel:
    post:
      operationId: cancelBillingSubscription
      tags: [account]
      summary: Cancel the recurring subscription
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Updated billing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/BillingUnavailable"
  /v1/billing/asaas/webhook:
    post:
      operationId: applyAsaasBillingWebhook
      tags: [account]
      summary: Apply an authenticated Asaas payment event
      responses:
        "200":
          description: Event accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                required: [received]
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/opportunities:
    get:
      operationId: searchOpportunities
      tags: [opportunities]
      summary: Search cultural funding opportunities
      security: [{ sessionCookie: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: state
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, pattern: "^[A-Za-z]{2}$" }
        - name: installation
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/OpportunityStatus"
        - name: program
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/OpportunityProgram"
        - name: deadlineFrom
          in: query
          description: Inclusive lower date in America/Sao_Paulo.
          schema: { type: string, format: date }
        - name: deadlineTo
          in: query
          description: Inclusive upper date in America/Sao_Paulo.
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Facets"
      responses:
        "200":
          description: Cultural opportunity result page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunitySearchResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "503":
          $ref: "#/components/responses/SearchUnavailable"
  /v1/opportunities/{id}:
    get:
      operationId: getOpportunityById
      tags: [opportunities]
      summary: Get a cultural funding opportunity
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Cultural opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunitySummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SearchUnavailable"
  /v1/me/saved-tenders:
    get:
      operationId: listSavedTenders
      tags: [account]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: monitored
          in: query
          schema:
            type: boolean
        - name: stage
          in: query
          schema:
            $ref: "#/components/schemas/ParticipationStage"
        - name: sort
          in: query
          schema:
            type: string
            enum: [saved_at, deadline]
        - name: upcoming
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Saved tender page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedTenderPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/me/saved-tenders/ids:
    get:
      operationId: getSavedTenderIds
      tags: [account]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Saved and monitored tender ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedTenderIds"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/me/saved-tenders/import:
    post:
      operationId: importSavedTenders
      tags: [account]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportSavedTendersRequest"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedTenderImportResult"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/me/saved-tenders/{tenderId}:
    parameters:
      - name: tenderId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      operationId: getSavedTender
      tags: [account]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Saved tender with user-declared participation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedTender"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putSavedTender
      tags: [account]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutSavedTenderRequest"
      responses:
        "200":
          description: Saved tender
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedTender"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteSavedTender
      tags: [account]
      security: [{ sessionCookie: [] }]
      responses:
        "204":
          description: Saved tender deleted or already absent
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/me/saved-searches:
    get:
      operationId: listSavedSearches
      tags: [account]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Saved searches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearchList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createSavedSearch
      tags: [account]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSavedSearchRequest"
      responses:
        "201":
          description: Saved search created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/me/saved-searches/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    patch:
      operationId: updateSavedSearch
      tags: [account]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSavedSearchRequest"
      responses:
        "200":
          description: Saved search updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteSavedSearch
      tags: [account]
      security: [{ sessionCookie: [] }]
      responses:
        "204":
          description: Saved search deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/me/saved-searches/{id}/seen:
    post:
      operationId: markSavedSearchSeen
      tags: [account]
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved search counters cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/me/saved-searches/{id}/restore:
    post:
      operationId: restoreSavedSearch
      tags: [account]
      summary: Restore a saved search deleted within the last 30 seconds
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved search restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/me/notifications:
    get:
      operationId: listNotifications
      tags: [account]
      security: [{ sessionCookie: [] }]
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Page"
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Notification page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      tags: [account]
      summary: Read email notification preferences outside the subscription gate
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Current notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      operationId: updateNotificationPreferences
      tags: [account]
      summary: Partially update email notification preferences
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationPreferencesRequest"
      responses:
        "200":
          description: Updated notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/email/unsubscribe:
    post:
      operationId: unsubscribeEmail
      tags: [account]
      summary: Disable email notifications using an opaque signed token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailUnsubscribeRequest"
      responses:
        "200":
          description: Updated email preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailUnsubscribeResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
  /v1/me/notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [account]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Unread notification count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadNotificationCount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/me/notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [account]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkNotificationsReadRequest"
      responses:
        "200":
          description: Remaining unread notification count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadNotificationCount"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: licita_session
  parameters:
    Query:
      name: q
      in: query
      schema:
        type: string
    SearchMode:
      name: mode
      in: query
      schema:
        $ref: "#/components/schemas/SearchMode"
        default: keyword
    StatusFilter:
      name: status
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: "#/components/schemas/TenderStatus"
    ModalityFilter:
      name: modality
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: "#/components/schemas/Modality"
    StateFilter:
      name: state
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: "^[A-Za-z]{2}$"
    CityFilter:
      name: city
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          minLength: 1
    OrganizationFilter:
      name: organizationId
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          minLength: 1
    SourceFilter:
      name: sourceId
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          minLength: 1
    CategoryFilter:
      name: category
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          minLength: 1
    ValueMin:
      name: valueMin
      in: query
      schema:
        type: number
        minimum: 0
    ValueMax:
      name: valueMax
      in: query
      schema:
        type: number
        minimum: 0
    PublishedFrom:
      name: publishedFrom
      in: query
      description: Inclusive lower publication date in America/Sao_Paulo.
      schema:
        type: string
        format: date
    PublishedTo:
      name: publishedTo
      in: query
      description: Inclusive upper publication date in America/Sao_Paulo.
      schema:
        type: string
        format: date
    DeadlineFrom:
      name: deadlineFrom
      in: query
      description: Inclusive lower proposal deadline date in America/Sao_Paulo.
      schema:
        type: string
        format: date
    DeadlineTo:
      name: deadlineTo
      in: query
      description: Inclusive upper proposal deadline date in America/Sao_Paulo.
      schema:
        type: string
        format: date
    Sort:
      name: sort
      in: query
      schema:
        $ref: "#/components/schemas/SortOption"
        default: relevance
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Facets:
      name: facets
      in: query
      schema:
        type: boolean
        default: true
    IncludeMonitored:
      name: includeMonitored
      in: query
      description: >-
        With a status filter and a signed-in user, also returns the tenders that user monitors,
        whatever their status (e.g. an open-only search still lists a monitored tender that closed).
        Ignored without a session. Such responses are private (never publicly cached).
      schema:
        type: boolean
        default: false
  responses:
    InvalidParameter:
      description: Invalid request parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SearchUnavailable:
      description: Search subsystem unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The request is forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource limit or state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BillingUnavailable:
      description: Billing provider is unavailable or rejected the operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SubscriptionRequired:
      description: An active subscription or development entitlement is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AiQuotaExceeded:
      description: Daily AI question quota exhausted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AiUnavailable:
      description: Tender question service unavailable or not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: [string, "null"]
        avatarUrl:
          type: [string, "null"]
          format: uri
        createdAt:
          type: string
          format: date-time
      required: [id, email, name, avatarUrl, createdAt]
    AuthSessionResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required: [user]
    DevLoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 120
      required: [email]
    BillingStatus:
      type: string
      enum: [none, pending, active, past_due, canceled]
    BillingEntitlementSource:
      type: [string, "null"]
      enum: [subscription, trial, beta, dev, null]
    BillingResponse:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/BillingStatus"
        entitled: { type: boolean }
        source:
          $ref: "#/components/schemas/BillingEntitlementSource"
        trialEndsAt: { type: [string, "null"], format: date-time }
        currentPeriodEnd: { type: [string, "null"], format: date-time }
        canCancel: { type: boolean }
        monthlyBrl: { type: [number, "null"] }
      required:
        [
          status,
          entitled,
          source,
          trialEndsAt,
          currentPeriodEnd,
          canCancel,
          monthlyBrl,
        ]
    BillingPlanResponse:
      type: object
      properties:
        monthlyBrl: { type: [number, "null"] }
        trialDays: { type: integer, enum: [7] }
        currency: { type: string, enum: [BRL] }
      required: [monthlyBrl, trialDays, currency]
    BillingCheckoutResponse:
      type: object
      properties:
        url: { type: string, format: uri }
      required: [url]
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      properties:
        confirm:
          type: string
          enum: [EXCLUIR]
      required: [confirm]
    EmailDigestPreference:
      type: string
      enum: [daily, off]
    EmailNotificationPreferences:
      type: object
      additionalProperties: false
      properties:
        digest:
          $ref: "#/components/schemas/EmailDigestPreference"
        immediateCritical:
          type: boolean
      required: [digest, immediateCritical]
    NotificationPreferences:
      type: object
      additionalProperties: false
      properties:
        email:
          $ref: "#/components/schemas/EmailNotificationPreferences"
        profileAlerts:
          type: boolean
        emailAddress:
          type: string
          format: email
        updatedAt:
          type: [string, "null"]
          format: date-time
      required: [email, profileAlerts, emailAddress, updatedAt]
    UpdateEmailNotificationPreferences:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        digest:
          $ref: "#/components/schemas/EmailDigestPreference"
        immediateCritical:
          type: boolean
    UpdateNotificationPreferencesRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        email:
          $ref: "#/components/schemas/UpdateEmailNotificationPreferences"
        profileAlerts:
          type: boolean
    EmailUnsubscribeScope:
      type: string
      enum: [all, digest, immediate]
    EmailUnsubscribeRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 500
        scope:
          $ref: "#/components/schemas/EmailUnsubscribeScope"
      required: [token, scope]
    EmailUnsubscribeResponse:
      type: object
      additionalProperties: false
      properties:
        scope:
          $ref: "#/components/schemas/EmailUnsubscribeScope"
        email:
          $ref: "#/components/schemas/EmailNotificationPreferences"
      required: [scope, email]
    AccountExportUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: [string, "null"] }
        avatarUrl: { type: [string, "null"], format: uri }
        trialEndsAt: { type: string, format: date-time }
        emailDigest:
          $ref: "#/components/schemas/EmailDigestPreference"
        emailImmediateCritical: { type: boolean }
        profileAlerts: { type: boolean }
        emailPreferencesUpdatedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        [
          id,
          email,
          name,
          avatarUrl,
          trialEndsAt,
          emailDigest,
          emailImmediateCritical,
          profileAlerts,
          emailPreferencesUpdatedAt,
          createdAt,
          updatedAt,
        ]
    AccountExportSession:
      type: object
      properties:
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
      required: [createdAt, lastSeenAt, expiresAt]
    AccountExportSavedTender:
      type: object
      allOf:
        - $ref: "#/components/schemas/ParticipationData"
      properties:
        tenderId: { type: string }
        savedAt: { type: string, format: date-time }
        monitored: { type: boolean }
        monitoredAt: { type: [string, "null"], format: date-time }
      required: [tenderId, savedAt, monitored, monitoredAt]
    AccountExportSavedSearch:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        query: { type: string }
        alertsEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, "null"], format: date-time }
        lastCheckedAt: { type: [string, "null"], format: date-time }
        newMatchesCount: { type: integer, minimum: 0 }
      required:
        [
          id,
          name,
          query,
          alertsEnabled,
          createdAt,
          updatedAt,
          deletedAt,
          lastCheckedAt,
          newMatchesCount,
        ]
    AccountExportNotification:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
        tenderId: { type: [string, "null"] }
        tenderTitle: { type: [string, "null"] }
        tenderNumberShort: { type: [string, "null"] }
        tenderOrganizationName: { type: [string, "null"] }
        tenderProposalDeadline: { type: [string, "null"], format: date-time }
        change:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        savedSearchId: { type: [string, "null"] }
        savedSearchName: { type: [string, "null"] }
        savedSearchQuery: { type: [string, "null"] }
        matchCount: { type: [integer, "null"] }
        tenderIds:
          type: array
          items: { type: string }
        profileMatches:
          type: array
          items:
            $ref: "#/components/schemas/ProfileMatchNotification"
      required:
        [
          id,
          type,
          createdAt,
          readAt,
          tenderId,
          tenderTitle,
          tenderNumberShort,
          tenderOrganizationName,
          tenderProposalDeadline,
          change,
          savedSearchId,
          savedSearchName,
          savedSearchQuery,
          matchCount,
          tenderIds,
          profileMatches,
        ]
    AccountExportEmailDelivery:
      type: object
      properties:
        id: { type: string }
        mode: { type: string, enum: [digest, immediate] }
        status: { type: string, enum: [queued, sent, failed, skipped] }
        recipientEmail: { type: string, format: email }
        subject: { type: string }
        attempts: { type: integer, minimum: 0 }
        lastError: { type: [string, "null"] }
        providerMessageId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        sentAt: { type: [string, "null"], format: date-time }
      required:
        [
          id,
          mode,
          status,
          recipientEmail,
          subject,
          attempts,
          lastError,
          providerMessageId,
          createdAt,
          updatedAt,
          sentAt,
        ]
    AccountExportSubscription:
      type: object
      properties:
        status: { type: string }
        currentPeriodEnd: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [status, currentPeriodEnd, updatedAt]
    AccountExportAiQuestion:
      type: object
      properties:
        id: { type: string }
        tenderId: { type: string }
        question: { type: string }
        status:
          { type: string, enum: [processing, answered, not_found, failed] }
        model: { type: [string, "null"] }
        inputTokens: { type: integer, minimum: 0 }
        estimatedCostUsd: { type: string }
        createdAt: { type: string, format: date-time }
      required:
        [
          id,
          tenderId,
          question,
          status,
          model,
          inputTokens,
          estimatedCostUsd,
          createdAt,
        ]
    AccountExport:
      type: object
      properties:
        exportedAt: { type: string, format: date-time }
        user:
          $ref: "#/components/schemas/AccountExportUser"
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/AccountExportSession"
        savedTenders:
          type: array
          items:
            $ref: "#/components/schemas/AccountExportSavedTender"
        savedSearches:
          type: array
          items:
            $ref: "#/components/schemas/AccountExportSavedSearch"
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/AccountExportNotification"
        emailDeliveries:
          type: array
          items:
            $ref: "#/components/schemas/AccountExportEmailDelivery"
        aiQuestions:
          type: array
          items:
            $ref: "#/components/schemas/AccountExportAiQuestion"
        companyProfile:
          anyOf:
            - $ref: "#/components/schemas/CompanyProfile"
            - type: "null"
        companyFits:
          type: array
          items:
            type: object
            additionalProperties: true
        fitUsage:
          type: array
          items:
            type: object
            additionalProperties: true
        subscription:
          anyOf:
            - $ref: "#/components/schemas/AccountExportSubscription"
            - type: "null"
      required:
        [
          exportedAt,
          user,
          sessions,
          savedTenders,
          savedSearches,
          notifications,
          emailDeliveries,
          aiQuestions,
          companyProfile,
          companyFits,
          fitUsage,
          subscription,
        ]
    TenderAskIndexStatus:
      type: string
      enum: [not_started, processing, ready, failed, no_documents, unsupported, expired]
    TenderAskDocument:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        pages: { type: [integer, "null"], minimum: 1 }
        status: { type: string, enum: [processing, ready, failed, unsupported] }
      required: [id, title, pages, status]
    AiQuota:
      type: object
      properties:
        used: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        resetsAt: { type: string, format: date-time }
      required: [used, limit, resetsAt]
    TenderAskStatus:
      type: object
      properties:
        index:
          $ref: "#/components/schemas/TenderAskIndexStatus"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/TenderAskDocument"
        unreadDocuments: { type: integer, minimum: 0 }
        quota:
          $ref: "#/components/schemas/AiQuota"
      required: [index, documents, unreadDocuments, quota]
    AskTenderRequest:
      type: object
      additionalProperties: false
      properties:
        question: { type: string, minLength: 3, maxLength: 300 }
      required: [question]
    AskTenderPassage:
      type: object
      properties:
        documentId: { type: string }
        documentTitle: { type: string }
        documentUrl: { type: string, format: uri }
        page: { type: integer, minimum: 1 }
        text: { type: string }
        relevance: { type: number, minimum: 0, maximum: 1 }
      required: [documentId, documentTitle, documentUrl, page, text, relevance]
    AskTenderResult:
      type: object
      properties:
        status: { type: string, enum: [answered, not_found, processing] }
        passages:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/AskTenderPassage"
        model: { type: string }
        quota:
          $ref: "#/components/schemas/AiQuota"
      required: [status, passages, model, quota]
    SheetFieldId:
      type: string
      enum:
        [
          consortium,
          subcontracting,
          me_epp,
          site_visit,
          samples,
          bid_guarantee,
          contract_guarantee,
          penalties,
          technical_qualification,
          financial_qualification,
          contract_term,
          delivery_term,
          price_adjustment,
        ]
    SheetEvidence:
      type: object
      additionalProperties: false
      properties:
        documentTitle: { type: string }
        documentUrl: { type: string, format: uri }
        page: { type: integer, minimum: 1 }
        text: { type: string }
      required: [documentTitle, documentUrl, page, text]
    SheetField:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/SheetFieldId"
        status: { type: string, enum: [found, not_found] }
        answer:
          type: [string, "null"]
          enum:
            [
              allowed,
              forbidden,
              limited,
              exclusive,
              quota,
              benefits_only,
              mandatory,
              optional,
              waived,
              required,
              not_required,
              null,
            ]
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        evidence:
          oneOf:
            - $ref: "#/components/schemas/SheetEvidence"
            - type: "null"
      required: [id, status, answer, confidence, evidence]
    QualificationType:
      type: string
      enum:
        [
          ato_societario,
          regularidade_fiscal,
          regularidade_trabalhista,
          qualificacao_tecnica,
          qualificacao_economica,
        ]
    QualificationItem:
      type: object
      additionalProperties: false
      properties:
        type:
          $ref: "#/components/schemas/QualificationType"
        evidence:
          $ref: "#/components/schemas/SheetEvidence"
        confidence: { type: number, minimum: 0, maximum: 1 }
      required: [type, evidence, confidence]
    TenderSheet:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/TenderAskIndexStatus"
        fields:
          type: array
          maxItems: 13
          items:
            $ref: "#/components/schemas/SheetField"
        qualificationChecklist:
          type: array
          items:
            $ref: "#/components/schemas/QualificationItem"
        unreadDocuments: { type: integer, minimum: 0 }
        model: { type: [string, "null"] }
        generatedAt: { type: [string, "null"], format: date-time }
      required:
        [status, fields, qualificationChecklist, unreadDocuments, model, generatedAt]
    CompanySize:
      type: string
      enum: [me_epp, cooperative, other]
    CompanyCoverage:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            scope: { type: string, enum: [national] }
          required: [scope]
        - type: object
          additionalProperties: false
          properties:
            scope: { type: string, enum: [states] }
            states:
              type: array
              minItems: 1
              maxItems: 27
              uniqueItems: true
              items: { type: string, minLength: 2, maxLength: 2 }
          required: [scope, states]
    CompanyValueRange:
      type: object
      additionalProperties: false
      properties:
        min: { type: [number, "null"], minimum: 0 }
        max: { type: [number, "null"], minimum: 0 }
      required: [min, max]
    CompanyProfileInput:
      type: object
      additionalProperties: false
      properties:
        description: { type: string, minLength: 20, maxLength: 600 }
        offerings:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 2, maxLength: 80 }
        exclusions:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 2, maxLength: 80 }
        coverage:
          $ref: "#/components/schemas/CompanyCoverage"
        valueRange:
          $ref: "#/components/schemas/CompanyValueRange"
        size:
          $ref: "#/components/schemas/CompanySize"
