        [
          tender_deadline_changed,
          tender_status_changed,
          tender_document_added,
          tender_value_changed,
          saved_search_new_matches,
          profile_new_matches,
          trial_ending,
          company_document_expiring,
        ]
    ProfileMatchNotification:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        organizationName: { type: string }
        proposalDeadline: { type: [string, "null"], format: date-time }
        level: { type: string, enum: [high] }
      required: [id, title, organizationName, proposalDeadline, level]
    Notification:
      type: object
      properties:
        id: { type: string }
        type:
          $ref: "#/components/schemas/NotificationType"
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
        tender:
          anyOf:
            - type: object
              properties:
                id: { type: string }
                title: { type: string }
                tenderNumberShort: { type: [string, "null"] }
                isNew:
                  type: boolean
                  description: Whether the linked tender is still inside the configured new-tender window.
              required: [id, title, tenderNumberShort, isNew]
            - type: "null"
        change:
          anyOf:
            - type: object
              properties:
                field: { type: string }
                from:
                  type: [string, number, "null"]
                to:
                  type: [string, number, "null"]
              required: [field, from, to]
            - type: "null"
        savedSearch:
          anyOf:
            - type: object
              properties:
                id: { type: string }
                name: { type: string }
                query: { type: string }
              required: [id, name, query]
            - type: "null"
        matchCount: { type: [integer, "null"] }
        newMatchCount:
          type: [integer, "null"]
          minimum: 0
          description: Number of linked notification results still inside the configured new-tender window.
        tenderIds:
          type: array
          maxItems: 20
          items: { type: string }
        profileMatches:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ProfileMatchNotification"
      required:
        [
          id,
          type,
          createdAt,
          readAt,
          tender,
          change,
          savedSearch,
          matchCount,
          newMatchCount,
          tenderIds,
          profileMatches,
        ]
    NotificationPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        pagination:
          $ref: "#/components/schemas/Pagination"
        unreadCount: { type: integer, minimum: 0 }
      required: [data, pagination, unreadCount]
    UnreadNotificationCount:
      type: object
      properties:
        unreadCount: { type: integer, minimum: 0 }
      required: [unreadCount]
    MarkNotificationsReadRequest:
      type: object
      additionalProperties: false
      properties:
        ids:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1 }
        all: { type: boolean }
    DismissNotificationsRequest:
      type: object
      additionalProperties: false
      properties:
        ids:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1 }
        allRead: { type: boolean, description: Removes every read notification. }
    DismissNotificationsResult:
      type: object
