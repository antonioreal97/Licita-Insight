openapi: 3.1.0
info:
  title: Pardal Digital API
  version: 1.3.0
  description: API pública do Pardal Digital
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: search
    description: Tender discovery operations
  - name: account
    description: Authentication and personal account operations
  - name: ai
    description: Evidence-only tender document questions
  - name: opportunities
    description: Cultural funding opportunity operations
  - name: transparency
    description: Official PNCP contract and item result history
  - name: recommendations
    description: Personalized, explainable in-app tender recommendations
  - name: feedback
    description: User reports about a tender page sent to the Pardal Digital team
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: PostgreSQL readiness check (2 second deadline)
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
        "503":
          description: PostgreSQL is unavailable
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: unavailable }
  /v1/tenders/search:
    get:
      operationId: searchTenders
      tags: [search]
      summary: Search tenders
      description: Serves only the first 1000 results (page × pageSize ≤ 1000); deeper pages return 400 with issue `beyond_result_window`, and `pagination.totalPages` is capped to the last reachable page while `total` stays the real count.
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/SearchMode"
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/ModalityFilter"
        - $ref: "#/components/parameters/StateFilter"
        - $ref: "#/components/parameters/CityFilter"
        - $ref: "#/components/parameters/OrganizationFilter"
        - $ref: "#/components/parameters/SourceFilter"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/PlatformFilter"
        - $ref: "#/components/parameters/NewOnly"
        - $ref: "#/components/parameters/NotificationFilter"
        - $ref: "#/components/parameters/MyRegion"
        - $ref: "#/components/parameters/ValueMin"
        - $ref: "#/components/parameters/ValueMax"
        - $ref: "#/components/parameters/PublishedFrom"
        - $ref: "#/components/parameters/PublishedTo"
        - $ref: "#/components/parameters/DeadlineFrom"
        - $ref: "#/components/parameters/DeadlineTo"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Facets"
      responses:
        "200":
          description: Search result page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SearchUnavailable"
  /v1/public/tenders/by-state:
    get:
      operationId: getOpenTendersByState
      tags: [search]
      summary: Count open tenders and sum their estimated values by state
      description: >-
        Public, no session. Always returns the 27 states. The aggregate is computed at most once every 15 minutes
        and served from memory in between.
      security: []
      responses:
        "200":
          description: Open tenders by state
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=300, stale-while-revalidate=600
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenTendersByStateResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SearchUnavailable"
  /v1/tenders/{id}:
    get:
      operationId: getTenderById
      tags: [search]
      summary: Get a tender by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Tender detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/transparency/contracts:
    get:
      operationId: searchTransparencyContracts
      tags: [transparency]
      summary: Search PNCP contracts in collected publication and update windows
      description: Serves only the first 1000 results (page × pageSize ≤ 1000); deeper pages return 400 with issue `beyond_result_window`, and `pagination.totalPages` is capped to the last reachable page while `total` stays the real count.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 160 } }
        - {
            name: state,
            in: query,
            schema: { type: string, minLength: 2, maxLength: 2 },
          }
        - {
            name: publishedFrom,
            in: query,
            schema: { type: string, format: date },
          }
        - {
            name: publishedTo,
            in: query,
            schema: { type: string, format: date },
          }
        - { name: valueMin, in: query, schema: { type: number, minimum: 0 } }
        - { name: valueMax, in: query, schema: { type: number, minimum: 0 } }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum: [published_desc, published_asc, value_desc, value_asc],
                default: published_desc,
              },
          }
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 12 },
          }
      responses:
        "200":
          description: Published contracts with source and coverage metadata
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/TransparencyContractsResponse" }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "503": { $ref: "#/components/responses/SearchUnavailable" }
  /v1/tenders/{id}/transparency/contracts:
    get:
      operationId: getTenderTransparencyContracts
      tags: [transparency]
      summary: Get PNCP contracts linked to a tender
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, minLength: 1 },
          }
      responses:
        "200":
          description: Contracts linked by PNCP purchase control number
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/TransparencyTenderContractsResponse",
                }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/SearchUnavailable" }
  /v1/tenders/{id}/transparency/results:
    get:
      operationId: getTenderTransparencyResults
      tags: [transparency]
      summary: Get PNCP item results linked to a tender
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, minLength: 1 },
          }
      responses:
        "200":
          description: Item results including cancelled history
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/TransparencyTenderResultsResponse",
                }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/SearchUnavailable" }
  /v1/tenders/{id}/award-history:
    get:
      operationId: getTenderAwardHistory
      tags: [transparency]
      summary: Get the award history of similar purchases by the same organization
      description: >
        Aggregates the last 24 months of PNCP contracts and item results of the tender's buying organization
        (same CNPJ; the buying unit when it has 3 or more similar purchases) whose object shares keywords with this
        tender. Public. Company names and CNPJs need active access (`meta.access.unlocked`); natural persons,
        foreign and unidentified suppliers are only counted as groups.
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, minLength: 1 },
          }
      responses:
        "200":
          description: Aggregated history; zero counts when nothing similar is in the collected coverage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwardHistoryResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/SearchUnavailable" }
  /v1/tenders/{id}/ask-status:
    get:
      operationId: getTenderAskStatus
      tags: [ai]
      summary: Get or start the document index used for tender questions
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Current index and daily quota status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderAskStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tenders/{id}/ask:
    post:
      operationId: askTender
      tags: [ai]
      summary: Find official passages that answer a question about a tender
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskTenderRequest"
      responses:
        "200":
          description: Evidence passages, an explicit no-result, or an indexing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskTenderResult"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AiQuotaExceeded"
        "503":
          $ref: "#/components/responses/AiUnavailable"
  /v1/tenders/{id}/feedback:
    post:
      operationId: submitTenderFeedback
      tags: [feedback]
      summary: Report wrong or missing information, a possible irregularity or a broken link on a tender page
      description: >-
        Works with or without a session (no subscription). Requires the CSRF header and Origin. With a valid session the
        report is linked to the account; without one it is anonymous and counted in the public_write rate limit by IP.
      security: [{}, { sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenderFeedbackRequest"
      responses:
        "201":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderFeedbackCreated"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/tenders/{id}/sheet:
    get:
      operationId: getTenderSheet
      tags: [ai]
      summary: Get or start the evidence-backed key-field sheet for a tender
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Sheet state mirroring the document index; all 13 fields are present when ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderSheet"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AiQuotaExceeded"
        "503":
          $ref: "#/components/responses/AiUnavailable"
  /v1/me/company-profile:
    get:
      operationId: getCompanyProfile
      tags: [ai]
      summary: Read the signed-in account company profile
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Current profile, or null when none was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      operationId: putCompanyProfile
      tags: [ai]
      summary: Replace the company profile and invalidate previous fit results
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyProfileInput"
      responses:
        "200":
          description: Updated versioned profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfileResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteCompanyProfile
      tags: [ai]
      summary: Delete the company profile and its cached fit results
      security: [{ sessionCookie: [] }]
      responses:
        "204":
          description: Profile deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/profile/categories:
    get:
      operationId: listProfileCategories
      tags: [account]
      summary: List the fixed tender taxonomy with current open-tender counts
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Categories ordered by the canonical taxonomy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileCategoriesResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/profile/municipalities:
    get:
      operationId: listProfileMunicipalities
      tags: [account]
      summary: Autocomplete the embedded IBGE municipality dataset
      security: [{ sessionCookie: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: state
          in: query
          schema: { type: string, minLength: 2, maxLength: 2 }
      responses:
        "200":
          description: Municipality references ordered by prefix match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileMunicipalitiesResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/me/company-profile/region-preview:
    get:
      operationId: getCompanyRegionPreview
      tags: [account]
      summary: Count open tenders matching the saved service region
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Approximate current open-tender count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, minimum: 0 }
                required: [count]
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/profile/platforms:
    get:
      operationId: listProfilePlatforms
      tags: [account]
      summary: List the bidding rooms and SICAF a company can declare it is registered in
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Known bidding rooms (with open-tender counts) followed by SICAF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePlatformsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/profile/keywords/suggest:
    get:
      operationId: suggestProfileKeywords
      tags: [account]
      summary: Autocomplete materialized terms from open tenders
      security: [{ sessionCookie: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
      responses:
        "200":
          description: At most ten prefix and co-occurrence suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileKeywordSuggestionsResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/profile/keywords/from-description:
    post:
      operationId: suggestProfileFiltersFromDescription
      tags: [account]
      summary: Suggest categories and materialized keywords from a company description
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileDescriptionSuggestionRequest"
      responses:
        "200":
          description: Suggested filters and an approximate open-tender match count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDescriptionSuggestions"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/profile/match-preview:
    post:
      operationId: previewProfileOpenTenderMatches
      tags: [account]
      summary: Count open tenders matching the profile terms and categories being edited
      description: >-
        Each term matches as a whole expression (words together and in order, Portuguese stemming), or the tender
        carries one of the categories. Nothing is stored.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileMatchPreviewRequest"
      responses:
        "200":
          description: Approximate count of open tenders that match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileMatchPreview"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/me/fit:
    get:
      operationId: getTenderFits
      tags: [ai]
      summary: Read or enqueue company-profile fit for up to 100 tenders
      security: [{ sessionCookie: [] }]
      parameters:
        - name: tenderIds
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Cached, filtered, or pending fit results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderFitsResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
  /v1/me/tender-highlights:
    get:
      operationId: getTenderHighlights
      tags: [ai]
      summary: Requirement highlights of up to 100 tenders, read from already-ready tender sheets
      description: >-
        Read only. Uses the latest ready tender sheet of each tender; never generates a sheet, enqueues a job or
        calls a model. Tenders without a ready sheet or without a highlighted requirement are absent from `results`.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: tenderIds
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Highlights by tender id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderHighlightsResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
  /v1/search/suggestions:
    get:
      operationId: getSearchSuggestions
      tags: [search]
      summary: Get search autocomplete suggestions
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 8
      responses:
        "200":
          description: Suggestions ordered by relevance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionsResponse"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SearchUnavailable"
  /v1/auth/google/start:
    get:
      operationId: startGoogleAuth
      tags: [account]
      summary: Start Google OAuth with PKCE
      parameters:
        - name: returnTo
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to Google authorization, or to /login?error=oauth_unavailable when credentials are absent
  /v1/auth/google/callback:
    get:
      operationId: completeGoogleAuth
      tags: [account]
      summary: Complete Google OAuth
      responses:
        "302":
          description: Redirect to the application
  /v1/auth/session:
    get:
      operationId: getAuthSession
      tags: [account]
      summary: Get the authenticated user
      responses:
        "200":
          description: Active session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [account]
      summary: Revoke the current session
      responses:
        "204":
          description: Session revoked or already absent
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/auth/logout-all:
    post:
      operationId: logoutAll
      tags: [account]
      summary: Revoke every session of the signed-in user, including the current one
      security: [{ sessionCookie: [] }]
      responses:
        "204":
          description: All sessions revoked
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/auth/dev-login:
    post:
      operationId: devLogin
      tags: [account]
      summary: Create a development-only session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevLoginRequest"
      responses:
        "204":
          description: Development session created
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/me:
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Permanently delete the authenticated account and its personal data
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: Account deleted and session cookie cleared
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/BillingUnavailable"
  /v1/me/export:
    get:
      operationId: exportAccountData
      tags: [account]
      summary: Export the authenticated user's retained personal data
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Personal data export
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename in the form pardal-digital-dados-YYYY-MM-DD.json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/me/usage-profile:
    get:
      operationId: getUsageProfile
      tags: [account]
