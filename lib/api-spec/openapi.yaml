            state: { type: [string, "null"] }
          required: [kind, state]
        - type: object
          properties:
            kind: { type: string, enum: [out_of_value_range] }
            estimatedValue: { type: number }
          required: [kind, estimatedValue]
        - type: object
          properties:
            kind: { type: string, enum: [value_not_published] }
          required: [kind]
        - type: object
          properties:
            kind: { type: string, enum: [size_restricted] }
            restriction:
              { type: string, enum: [me_epp_exclusive, me_epp_quota] }
            evidence:
              $ref: "#/components/schemas/FitEvidence"
          required: [kind, restriction, evidence]
    TenderFit:
      type: object
      properties:
        status: { type: string, enum: [ready, pending, filtered] }
        level: { type: [string, "null"], enum: [high, medium, low, null] }
        score: { type: [number, "null"], minimum: 0, maximum: 1 }
        reasons:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/FitReason"
        model: { type: [string, "null"] }
        checkedAt: { type: [string, "null"], format: date-time }
      required: [status, level, score, reasons, model, checkedAt]
    TenderFitsResponse:
      type: object
      properties:
        profileVersion: { type: [integer, "null"], minimum: 1 }
        results:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TenderFit"
      required: [profileVersion, results]
    TenderRequirementHighlight:
      type: object
      properties:
        code:
          type: string
          enum:
            [
              me_epp_exclusive,
              me_epp_quota,
              site_visit,
              bid_guarantee,
              samples,
              technical_certificate,
              technical_qualification,
              minimum_capital,
              contract_guarantee,
            ]
        label: { type: string }
      required: [code, label]
    TenderHighlights:
      type: object
      properties:
        requirements:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/TenderRequirementHighlight"
      required: [requirements]
    TenderHighlightsResponse:
      type: object
      properties:
        results:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TenderHighlights"
      required: [results]
    TenderStatus:
      type: string
      enum: [open, under_review, closed, suspended, cancelled, direct]
      description: >-
        `open` is a competitive opportunity with an active window (including electronic
        dispensa with a proposal deadline, and credenciamento without a deadline as a
        continuous call). `direct` is dispensa or inexigibilidade with no proposal_deadline
        (contratação direta sem disputa). Pregão/other without a deadline stay as mapped by
        the source situation and are not auto-promoted to `direct`.
    EstimatedValueStatus:
      type: string
      enum: [disclosed, confidential, not_published]
    EstimatedValueFlag:
      type: string
      enum: [absolute_ceiling, dispensa_legal_limit, modality_outlier]
      description: >-
        Why the estimated value published by the source looks wrong. `absolute_ceiling`: above R$ 100 billion.
        `dispensa_legal_limit`: a "dispensa" by value (Lei 14.133/2021, art. 75, I or II) more than a thousand
        times above its legal limit. `modality_outlier`: more than a thousand times the 99th percentile of the
        modality.
    Modality:
      type: string
      enum:
        - pregao_eletronico
        - pregao_presencial
        - concorrencia
        - concorrencia_eletronica
        - dispensa
        - inexigibilidade
        - credenciamento
        - leilao
        - dialogo_competitivo
        - other
    SortOption:
      type: string
      enum:
        [
          relevance,
          deadline_asc,
          published_desc,
          first_seen_desc,
          value_desc,
          value_asc,
        ]
    SearchMode:
      type: string
      enum: [keyword, semantic, hybrid]
    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required: [id, name]
    Location:
      type: object
      properties:
        state:
          type: [string, "null"]
        city:
          type: [string, "null"]
        cityIbgeCode:
          type: [string, "null"]
      required: [state, city, cityIbgeCode]
    Source:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: [string, "null"]
          format: uri
      required: [id, name, url]
    TenderPlatform:
      type: object
      description: >-
        Where the dispute happens, normalized from the PNCP publishing system. `platform` = known bidding
        room; `source_system` = management software that published the tender (not the room);
        `other` = any other publisher; `unknown` = the PNCP did not say.
      properties:
        slug: { type: string }
        label: { type: string }
        kind:
          type: string
          enum: [platform, source_system, other, unknown]
        url:
          type: [string, "null"]
          format: uri
      required: [slug, label, kind, url]
    Category:
      type: object
      properties:
        slug:
          type: string
        label:
          type: string
      required: [slug, label]
    Highlight:
      type: object
      properties:
        field:
          type: string
          enum: [title, objectSummary, items]
        fragments:
          type: array
          items:
            type: string
      required: [field, fragments]
    Relevance:
      type: object
      properties:
        score:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        highlights:
          type: array
          items:
            $ref: "#/components/schemas/Highlight"
      required: [score, highlights]
    TenderSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        displayTitle:
          type: string
        displayTitleSource:
          type: [string, "null"]
          enum: [rules, model, null]
        objectSummary:
          type: [string, "null"]
        organization:
          $ref: "#/components/schemas/Organization"
        purchasingUnit:
          type: [string, "null"]
        modality:
          $ref: "#/components/schemas/Modality"
        modalityLabel:
          type: string
        status:
          $ref: "#/components/schemas/TenderStatus"
        tenderNumber:
          type: [string, "null"]
        tenderNumberShort:
          type: [string, "null"]
          description: Source-normalized tender number without the modality prefix.
        estimatedValue:
          type: [number, "null"]
        estimatedValueStatus:
          $ref: "#/components/schemas/EstimatedValueStatus"
        estimatedValueFlag:
          description: >-
            Set when the official `estimatedValue` is implausible; null otherwise. The value is still returned
            as published, but it is left out of sums, value facets and value filters, and sorted last by value.
          oneOf:
            - $ref: "#/components/schemas/EstimatedValueFlag"
            - type: "null"
        publishedAt:
          type: [string, "null"]
          format: date-time
        openingAt:
          type: [string, "null"]
          format: date-time
        proposalDeadline:
          type: [string, "null"]
          format: date-time
        location:
          $ref: "#/components/schemas/Location"
        source:
          $ref: "#/components/schemas/Source"
        platform:
          anyOf:
            - $ref: "#/components/schemas/TenderPlatform"
            - type: "null"
          description: Null until the tender is ingested or backfilled with the platform column.
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        relevance:
          $ref: "#/components/schemas/Relevance"
        updatedAt:
          type: string
          format: date-time
        firstSeenAt:
          type: string
          format: date-time
          description: Time when this tender was first inserted into Pardal. PNCP publication date is unrelated.
        isNew:
          type: boolean
          description: Calculated with the server clock and `NEW_TENDER_WINDOW_HOURS`.
      required:
        - id
        - title
        - displayTitle
        - displayTitleSource
        - objectSummary
        - organization
        - purchasingUnit
        - modality
        - modalityLabel
        - status
        - tenderNumber
        - estimatedValue
        - publishedAt
        - openingAt
        - proposalDeadline
        - location
        - source
        - platform
        - categories
        - relevance
        - updatedAt
        - firstSeenAt
        - isNew
