name: pardal-oracle

x-app: &app
  platform: ${ORACLE_PLATFORM:-linux/arm64}
  build:
    context: .
    dockerfile: Dockerfile.prod
  image: pardal-digital:${IMAGE_TAG:-oracle-stage-0}
  env_file:
    - ${ORACLE_ENV_FILE:-.env.oracle}
  environment:
    DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.oracle}
    NODE_ENV: production
    STATIC_DIR: /app/artifacts/licitainsight/dist/public
    TRUST_PROXY: "1"
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  networks: [backend]

services:
  db:
    image: pgvector/pgvector:pg16-bookworm
    platform: ${ORACLE_PLATFORM:-linux/arm64}
    restart: unless-stopped
    env_file:
      - ${ORACLE_ENV_FILE:-.env.oracle}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.oracle}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.oracle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.oracle}
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=100
    # The host binding is only on tailscale0. OCI Security Lists must not allow 5432.
    ports:
      - "${ORACLE_TAILSCALE_IP:?set the A1 Tailscale IPv4}:5432:5432"
    volumes:
      - ${ORACLE_DATA_DIR:-/srv/pardal/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 8g
    mem_reservation: 4g
    networks: [backend]

  api:
    <<: *app
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.oracle}
      NODE_ENV: production
      STATIC_DIR: /app/artifacts/licitainsight/dist/public
      TRUST_PROXY: "1"
      APP_ROLE: api
      PORT: "3001"
      DB_POOL_MAX: "20"
      DB_APPLICATION_NAME: pardal-oracle-api
    expose: ["3001"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    mem_limit: 3g
    mem_reservation: 1g

  light-worker:
    <<: *app
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.oracle}
      NODE_ENV: production
      APP_ROLE: worker
      WORKER_JOBS: light
      WORKER_HEALTH_PORT: "3002"
      DB_POOL_MAX: "10"
      DB_APPLICATION_NAME: pardal-oracle-light-worker
    expose: ["3002"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/api/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    mem_reservation: 512m

  proxy:
    image: nginx:1.27-alpine
    platform: ${ORACLE_PLATFORM:-linux/arm64}
    restart: unless-stopped
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME in .env.oracle}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/oracle-edge/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR in .env.oracle}:/etc/nginx/tls:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    mem_reservation: 64m
    networks: [backend]

networks:
  backend:
    driver: bridge
