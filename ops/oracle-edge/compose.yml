name: abriu-oracle-edge

services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Usa a interface Tailscale do host Linux. Somente 80/443 sao publicos.
    network_mode: host
    mem_limit: 128m
    # Retenção técnica limitada: no máximo 18 arquivos de 10 MiB por container.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "18"
    environment:
      NGINX_LISTEN: "127.0.0.1:8080"
      NGINX_UPSTREAM: ${MACBOOK_TAILSCALE_IP:?Defina o IPv4 Tailscale do servidor}:${MACBOOK_BIND_PORT:-24252}
      ORIGIN_SHARED_SECRET: ${ORIGIN_SHARED_SECRET:?Defina o mesmo segredo da Vercel e do servidor}
      ORIGIN_MODE: enforce
      EDGE_HOST: ${EDGE_HOST:-137-131-233-192.sslip.io}
      NGINX_ENVSUBST_FILTER: "^(NGINX_LISTEN|NGINX_UPSTREAM|ORIGIN_SHARED_SECRET|ORIGIN_MODE|EDGE_HOST)$"
    volumes:
      - ./templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./templates/http.conf.template:/etc/nginx/templates/http.conf.template:ro
      - ./tls.conf:/etc/nginx/abriu-server.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./acme:/var/www/acme:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:v2.11.0
    profiles: [maintenance]
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./acme:/var/www/acme
    entrypoint: certbot
