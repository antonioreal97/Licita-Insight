name: licita-macbook

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: licita
      POSTGRES_PASSWORD: ${MAC_DB_PASSWORD:?Defina MAC_DB_PASSWORD no .env}
      POSTGRES_DB: licita
    volumes:
      - licita_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licita -d licita"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-setup:
    profiles: [setup]
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      platforms: [linux/amd64]
    environment:
      DATABASE_URL: postgres://licita:${MAC_DB_PASSWORD:?Defina MAC_DB_PASSWORD no .env}@postgres:5432/licita
    command: >-
      sh -c "pnpm --filter @workspace/db run prepare-extensions &&
      pnpm --filter @workspace/db run push-force"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.prod
      platforms: [linux/amd64]
    restart: unless-stopped
    init: true
    env_file: ${MACBOOK_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      APP_ROLE: all
      PORT: "3001"
      # Endpoint Prometheus privado, acessivel apenas pela rede interna do Docker.
      METRICS_PORT: "9091"
      STATIC_DIR: /app/artifacts/licitainsight/dist/public
      DATABASE_URL: postgres://licita:${MAC_DB_PASSWORD:?Defina MAC_DB_PASSWORD no .env}@postgres:5432/licita
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-http://localhost:24252}
      TRUST_PROXY: "1"
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET no .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Defina OPENAI_API_KEY no .env}
      TITLE_TEACHER_ENABLED: "false"
      # Titulos ficam com as regras; a OpenAI fica so para as consultas de documentos.
      # Reversivel pelo .env do servidor (TITLE_TEACHER_OPENAI_ENABLED=true) + up -d.
      TITLE_TEACHER_OPENAI_ENABLED: ${TITLE_TEACHER_OPENAI_ENABLED:-false}
      TITLE_OPENAI_DAILY_LIMIT: ${TITLE_OPENAI_DAILY_LIMIT:-500}
      # Categorias: aluno local no job noturno (00:00-05:30) e Jev como professor dos duvidosos.
      CATEGORY_STUDENT_ENABLED: ${CATEGORY_STUDENT_ENABLED:-true}
      NIGHTLY_CATEGORY_WINDOW_START: ${NIGHTLY_CATEGORY_WINDOW_START:-00:00}
      NIGHTLY_CATEGORY_WINDOW_END: ${NIGHTLY_CATEGORY_WINDOW_END:-05:30}
      JEV_TEACHER_DAILY_LIMIT: ${JEV_TEACHER_DAILY_LIMIT:-1500}
      JEV_TEACHER_CONFIDENCE_THRESHOLD: ${JEV_TEACHER_CONFIDENCE_THRESHOLD:-0.6}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      # Curto: o modelo sai da memoria poucos minutos depois da ultima chamada da janela.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2m}
      # A primeira chamada da noite carrega o modelo do disco; folga para a CPU do servidor.
      OLLAMA_EMBED_TIMEOUT_MS: ${OLLAMA_EMBED_TIMEOUT_MS:-180000}
      AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-10}
      DOCUMENT_OCR_ENABLED: ${DOCUMENT_OCR_ENABLED:-false}
      DOCUMENT_OCR_URL: http://ocr:8080
      PNCP_DAILY_COLLECT: ${PNCP_DAILY_COLLECT:-false}
      TRANSPARENCY_DAILY_COLLECT: ${TRANSPARENCY_DAILY_COLLECT:-false}
      CULTURE_DAILY_COLLECT: ${CULTURE_DAILY_COLLECT:-false}
      AUTH_DEV_LOGIN: "false"
      BILLING_DEV_ENTITLED: "false"
      TZ: America/Sao_Paulo
    expose:
      - "3001"
      - "9091"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 90s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/readyz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Embeddings do aluno de categorias. So a rede interna do Compose alcanca a porta 11434.
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.2}
    restart: unless-stopped
    init: true
    cpus: 2
    mem_limit: 2g
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2m}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - licita_ollama:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Baixa o modelo de embedding no primeiro start (e quando OLLAMA_EMBED_MODEL muda); com o
  # modelo ja no volume, termina em segundos. Sai com 0 e nao reinicia.
  ollama-pull:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.2}
    restart: "no"
    cpus: 0.5
    mem_limit: 256m
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_EMBED_MODEL:-bge-m3}"]
    depends_on:
      ollama:
        condition: service_healthy

  ocr:
    platform: linux/amd64
    build:
      context: ./ops/ocr
      dockerfile: Dockerfile
      platforms: [linux/amd64]
    restart: unless-stopped
    init: true
    cpus: 1
    mem_limit: 768m
    environment:
      DOCUMENT_OCR_MAX_PAGES: ${DOCUMENT_OCR_MAX_PAGES:-40}
      DOCUMENT_OCR_PAGE_TIMEOUT_MS: ${DOCUMENT_OCR_PAGE_TIMEOUT_MS:-30000}
      OMP_THREAD_LIMIT: "1"
    expose:
      - "8080"

  proxy:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    mem_limit: 64m
    # Retenção técnica limitada: no máximo 18 arquivos de 10 MiB por container.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "18"
    environment:
      ORIGIN_SHARED_SECRET: ${ORIGIN_SHARED_SECRET:-}
      ORIGIN_MODE: ${ORIGIN_MODE:-log}
      NGINX_UPSTREAM: app:3001
      NGINX_LISTEN: "8080"
      NGINX_ENVSUBST_FILTER: "^(ORIGIN_SHARED_SECRET|ORIGIN_MODE|NGINX_UPSTREAM|NGINX_LISTEN)$"
    volumes:
      - ./ops/macbook/nginx/templates:/etc/nginx/templates:ro
      - ./ops/macbook/nginx/server.conf:/etc/nginx/abriu-server.conf:ro
    ports:
      - "127.0.0.1:${MACBOOK_BIND_PORT:-24252}:8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/api/healthz >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  licita_pg:
  licita_ollama:
