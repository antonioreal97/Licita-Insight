    <meta name="robots" content="index, follow" />

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
      // Applies the saved theme before first paint, on every route (the AppShell toggle writes this key).
      try {
        if (localStorage.getItem('licita-theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (error) {
        console.error('Não foi possível ler o tema salvo (licita-theme).', error);
      }
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
